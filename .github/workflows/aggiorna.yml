name: Aggiorna autori in pubblico dominio

on:
  schedule:
    - cron: "17 5 1 * *"   # il primo di ogni mese
  push:                     # parte da solo quando cambia uno script
    paths:
      - "scripts/**"
      - "index.html"   # la home inglese (en/index.html) si rigenera da index.html
      - ".github/workflows/aggiorna.yml"
  workflow_dispatch:        # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write
  actions: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica gli autori da Wikidata
        run: python scripts/aggiorna.py
      - name: Aggiungi biografie, opere e popolarità
        # se questo passo fallisce, l'elenco degli autori viene salvato comunque
        continue-on-error: true
        env:
          BUDGET_MINUTI: "90"
        run: python scripts/arricchisci.py
      - name: Controlla in quali lingue esistono le opere
        # dato accessorio: se fallisce, il resto viene salvato comunque
        continue-on-error: true
        env:
          BUDGET_MINUTI_TRAD: "25"
        run: python scripts/traduzioni.py
      - name: Conta le edizioni italiane nel catalogo SBN
        # dato accessorio: se fallisce, il resto viene salvato comunque
        continue-on-error: true
        env:
          BUDGET_MINUTI_SBN: "25"
        run: python scripts/sbn.py
      - name: Crea le pagine degli autori e la sitemap
        if: always()
        run: python scripts/pagine.py
      - name: Salva i dati nel repository
        # sempre, anche se un passo prima è stato interrotto: così il lavoro fatto non si perde
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data autore sitemap.xml
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Aggiornamento dati $(date -u +%Y-%m-%d)"
            # GitHub ogni tanto rifiuta il push con un errore suo: si riprova fino a 5 volte
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main   # in caso di conflitto sui dati vincono quelli appena scaricati
              if git push; then break; fi
              echo "Push fallito (tentativo $i), riprovo tra $((i*20)) secondi"
              [ "$i" = 5 ] && exit 1
              sleep $((i*20))
            done
          fi
      - name: Se non ha fatto in tempo, riparte da solo
        # i dati già scaricati restano in cache: il giro dopo continua da dove si è fermato
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .incompleto ]; then
            gh workflow run aggiorna.yml --ref main
          fi
