name: Aggiorna autori in pubblico dominio

on:
  schedule:
    # ogni tre mesi (gennaio, aprile, luglio, ottobre) e a dicembre, prima del 1° gennaio (decisione di Marco, 19/11/2026).
    # Non parte più da solo quando cambia uno script: si lancia a mano col pulsante "Run workflow" quando serve.
    - cron: "17 5 1 1,4,7,10,12 *"
  workflow_dispatch:        # pulsante "Run workflow" per lanciarlo a mano
  # NIENTE ripartenze automatiche (decisione di Marco, 19/11/2026): se un giro non finisce, il resto lo fa il giro
  # previsto dopo, e docs/da-decidere.md lo segnala.

permissions:
  contents: write
  actions: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica gli autori da Wikidata
        run: python scripts/aggiorna.py
      - name: Aggiungi biografie, opere e popolarità
        # se questo passo fallisce, l'elenco degli autori viene salvato comunque
        continue-on-error: true
        env:
          BUDGET_MINUTI: "90"
        run: python scripts/arricchisci.py
      - name: Cittadinanza di tutti gli autori (Wikidata P27), per la nota sui paesi alleati
        # se Wikidata non risponde resta «non nota»: niente nota (scripts/regole.py)
        continue-on-error: true
        run: python scripts/cittadinanza.py
      - name: Controlla in quali lingue esistono le opere
        # dato accessorio: se fallisce, il resto viene salvato comunque
        continue-on-error: true
        env:
          BUDGET_MINUTI_TRAD: "25"
        run: python scripts/traduzioni.py
      - name: Conta le edizioni italiane nel catalogo SBN
        # dato accessorio: se fallisce, il resto viene salvato comunque
        continue-on-error: true
        env:
          BUDGET_MINUTI_SBN: "25"
        run: python scripts/sbn.py
      - name: Conta le edizioni francesi nel catalogo della BnF
        # dato accessorio: se fallisce, il resto viene salvato comunque
        continue-on-error: true
        env:
          BUDGET_MINUTI_BNF: "25"
        run: python scripts/bnf.py
      - name: Conta le edizioni in spagnolo (BNE) e in inglese (British Library)
        # dato accessorio: se fallisce, il resto viene salvato comunque
        continue-on-error: true
        env:
          BUDGET_MINUTI_ALMA: "30"
        run: python scripts/alma.py
      - name: Conta le edizioni in inglese negli USA (Library of Congress)
        # dato accessorio: se fallisce, il resto viene salvato comunque
        continue-on-error: true
        env:
          BUDGET_MINUTI_LOC: "30"
        run: python scripts/loc.py
      - name: Opere in pubblico dominio negli USA (Wikidata, Wikipedia, Commons)
        # dato accessorio: se fallisce, il resto viene salvato comunque
        continue-on-error: true
        run: python scripts/opere.py
      - name: Verifica l'anno di uscita dei libri USA (registro del copyright, biblioteche, Open Library, Library of Congress)
        # metodo in docs/metodo-anni-opere.md; se una fonte non risponde lo scrive in docs/da-decidere.md
        continue-on-error: true
        env:
          BUDGET_MINUTI_USA: "30"
        run: python scripts/verifica_anni_usa.py
      - name: Nomi inglesi di paesi e lingue (Wikidata)
        continue-on-error: true
        run: python scripts/etichette.py
      - name: Seconda fonte per gli anni di morte (GND, Library of Congress) e illustratori
        # controllo in più: se le biblioteche non rispondono, le pagine escono comunque
        continue-on-error: true
        run: python scripts/verifica.py
      - name: Controlli sui conteggi dei cataloghi (i dati che si contraddicono restano sospesi)
        # anche se un passo prima è fallito: i dati vecchi nei file vanno ricontrollati comunque
        if: ${{ !cancelled() }}   # se il giro viene annullato non si salva niente (19/11/2026: un giro annullato aveva salvato dati a metà)
        run: python scripts/controlli.py
      - name: Liste con l'anno di morte del registro unico (scripts/applica_registro_liste.py)
        # 22/11/2026: le liste nascono da Wikidata; l'anno di morte che vale è quello deciso nel registro
        if: ${{ !cancelled() }}
        run: python scripts/applica_registro_liste.py
      - name: Registro delle opere (anni USA e coautori decisi con la regola unica)
        if: ${{ !cancelled() }}
        run: python storico/registro_opere.py
      - name: Crea le pagine degli autori e la sitemap
        if: ${{ !cancelled() }}   # se il giro viene annullato non si salva niente (19/11/2026: un giro annullato aveva salvato dati a metà)
        run: python scripts/pagine.py
      - name: Controllo delle regole per paese (Python e browser uguali) e delle frasi sui paesi
        # bloccante: se le regole non coincidono o una pagina dice una cosa imprecisa, non si salva niente.
        # Gira sempre (anche se un passo prima si è rotto), e «Salva» parte solo se questo controllo è riuscito
        # (22/11/2026: prima «Salva» partiva anche con il controllo fallito)
        id: controlli
        if: ${{ !cancelled() }}
        run: |
          python scripts/prova_regole.py
          python scripts/controllo_frasi.py
      - name: Elenco delle cose da decidere con Marco (docs/da-decidere.md)
        if: ${{ !cancelled() }}   # se il giro viene annullato non si salva niente (19/11/2026: un giro annullato aveva salvato dati a metà)
        continue-on-error: true
        run: python scripts/da_decidere.py
      - name: Salva i dati nel repository
        # anche se un passo di raccolta si è interrotto (il lavoro fatto non si perde), ma SOLO se i controlli sono passati;
        # se il giro viene annullato non si salva niente (19/11/2026: un giro annullato aveva salvato dati a metà)
        if: ${{ !cancelled() && steps.controlli.outcome == 'success' }}
        run: |
          # se i dati degli autori sono incompleti (biografie o visite calate di oltre il 20%) si rimettono quelli di prima
          if ! python scripts/controlla_salvataggio.py; then
            git checkout -- data/[0-9]*.json data/es-[0-9]*.json autore en/author index.html en/index.html radar/index.html en/radar/index.html sitemap.xml 2>/dev/null || true
            git clean -fdq autore en/author 2>/dev/null || true
            python scripts/da_decidere.py || true   # così l'elenco «da decidere» lo dice
            rm -f .salvataggio_rifiutato
          fi
          # fotografia dello stato giuridico: se qualcuno che c'era già cambia stato senza un motivo atteso, non si pubblica
          # (scripts/confronta_fotografia.py); si salva solo l'elenco dei cambi da approvare, e il giro finisce rosso
          if ! python scripts/confronta_fotografia.py --giro; then
            git reset -q
            git add docs/cambi-da-approvare.md
            bash scripts/salva.sh "Cambi di stato da approvare $(date -u +%Y-%m-%d) (niente pubblicato)"
            exit 1
          fi
          git add -A
          bash scripts/salva.sh "Aggiornamento dati $(date -u +%Y-%m-%d)"
