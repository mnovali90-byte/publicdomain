name: Autori mancanti nelle liste (Wikipedia in 6 lingue e GND; non cambia il sito)

# Parte solo cambiando docs/registro/passo-mancanti.txt, con l'ok di Marco (23/11/2026).
# Scrive solo il rapporto: docs/autori-mancanti-<anno>.md e data/registro/autori_mancanti_<anno>.json.
on:
  push:
    paths:
      - "docs/registro/passo-mancanti.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autori-mancanti
  cancel-in-progress: false

jobs:
  mancanti:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Candidati da Wikipedia (morti dell'anno, 6 lingue) e GND, poi cosa ne sa Wikidata
        env:
          BUDGET_MINUTI: "40"
          ANNO: "2027"
        run: python scripts/autori_mancanti.py
      - name: Salva solo il rapporto
        if: ${{ !cancelled() }}
        run: |
          git add docs/autori-mancanti-*.md data/registro/autori_mancanti_*.json 2>/dev/null || true
          bash scripts/salva.sh "Autori mancanti: rapporto"
