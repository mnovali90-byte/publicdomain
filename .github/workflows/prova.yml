name: Prova temporanea leggi
on: { push: { paths: ["scripts/prova_leggi.py", ".github/workflows/prova.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
      - run: pip install pypdf
      - run: python scripts/prova_leggi.py
