name: Prova temporanea leggi
on: { push: { paths: ["scripts/prova_leggi.py", ".github/workflows/prova.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/prova_leggi.py
