name: Controllo delle citazioni della ricerca sul web (non cambia il sito)

# Parte solo cambiando docs/registro/passo-citazioni.txt, con l'ok di Marco (23/11/2026).
# Scrive solo il rapporto: docs/ricerca-web/controllo-citazioni.md e data/registro/controllo_citazioni.json.
on:
  push:
    paths:
      - "docs/registro/passo-citazioni.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citazioni
  cancel-in-progress: false

jobs:
  citazioni:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apre ogni link e cerca la citazione
        run: |
          sudo apt-get install -y -q poppler-utils >/dev/null 2>&1 || true
          python scripts/controlla_citazioni.py
      - name: Salva solo il rapporto
        if: ${{ !cancelled() }}
        run: |
          git add data/registro/controllo_citazioni.json docs/ricerca-web/controllo-citazioni.md 2>/dev/null || true
          bash scripts/salva.sh "Controllo delle citazioni: rapporto"
