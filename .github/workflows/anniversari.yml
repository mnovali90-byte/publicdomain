name: Calendario anniversari

on:
  schedule:
    - cron: "43 4 1 * *"   # il primo di ogni mese
  push:
    paths:
      - "scripts/anniversari.py"
      - "data/anniversari_esclusioni.json"
      - ".github/workflows/anniversari.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anniversari
  cancel-in-progress: false

jobs:
  anniversari:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cerca gli anniversari (Wikidata, SBN)
        run: python scripts/anniversari.py
      - name: Crea le pagine
        run: python scripts/pagine.py
      - name: Salva nel repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Calendario anniversari $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash -X theirs origin main
              if git push; then break; fi
              [ "$i" = 5 ] && exit 1
              sleep $((i*20))
            done
          fi
