name: Prova Google Libri (temporanea)
on:
  push:
    paths:
      - "scripts/prova_google.py"
      - ".github/workflows/prova-google.yml"
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/prova_google.py
        env:
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
