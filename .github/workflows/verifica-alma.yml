name: Verifica conteggio Alma (British Library, BNE)

# Il passo da fare si scrive in docs/verifica-alma/passo.txt: «prove» (raccoglie le prove senza il nuovo sistema)
# oppure «misura» (dopo gli esiti a mano). Parte a ogni modifica di quel file.
on:
  push:
    paths:
      - "docs/verifica-alma/passo.txt"

permissions:
  contents: write

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Passo indicato in passo.txt
        env:
          BUDGET_MINUTI_SBN: "100"
        run: |
          read passo cartella seme < docs/verifica-alma/passo.txt
          VERIFICA_DIR="${cartella:-verifica-alma}" VERIFICA_SEME="${seme:-20261120}" python scripts/verifica_alma.py "$passo"
      - name: Salva
        if: always()
        run: |
          git add docs/verifica-alma*
          bash scripts/salva.sh "Verifica Alma: passo $(cat docs/verifica-alma/passo.txt)"
