name: Esplorazione dei 20 ambigui SBN (non cambia il sito)

# Analisi esplorativa: parte quando cambia docs/esplora-ambigui/passo.txt. Non cambia il sito né le regole.
on:
  push:
    paths:
      - "docs/esplora-ambigui/passo.txt"

permissions:
  contents: write

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Passo indicato in passo.txt
        env:
          BUDGET_MINUTI_SBN: "100"
        run: python scripts/$(tr -d "[:space:]" < docs/esplora-ambigui/passo.txt).py
      - name: Salva
        if: always()
        run: |
          git add docs/esplora-ambigui
          bash scripts/salva.sh "Esplorazione ambigui: passo $(cat docs/esplora-ambigui/passo.txt)"
