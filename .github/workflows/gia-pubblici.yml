name: Pagina Già pubblici (ritratti e pagina)

on:
  workflow_run:              # dopo ogni aggiornamento dello Storico
    workflows: ["Aggiorna lo Storico (opere già libere)"]
    types: [completed]
  push:
    paths:
      - "storico/pagina.py"
      - "storico/pagina.html"
      - "storico/ritratti.py"
      - "storico/verifica_anni.py"
      - ".github/workflows/gia-pubblici.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gia-pubblici
  cancel-in-progress: false

jobs:
  pagina:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ritratti da Wikimedia Commons
        continue-on-error: true   # senza ritratti la pagina mostra le iniziali
        run: python storico/ritratti.py
      - name: "Anni delle opere libere solo negli USA, conferma da Duke, Open Library, Library of Congress (docs/metodo-anni-opere.md)"
        continue-on-error: true
        run: python storico/verifica_anni.py 40
      - name: Dati e pagine
        run: python storico/pagina.py
      - name: Schede autore (lo stato USA opera per opera dipende dagli anni verificati)
        run: python scripts/pagine.py
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/storico gia-pubblici en/already-public autore en/author
          if ! git diff --cached --quiet; then
            git commit -m "Già pubblici: pagina e dati del $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep $((i*20)); done
          fi
