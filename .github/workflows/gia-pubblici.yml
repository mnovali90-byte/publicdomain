name: Pagina Già pubblici (ritratti e pagina)

on:
  workflow_run:              # dopo ogni aggiornamento dello Storico
    workflows: ["Aggiorna lo Storico (opere già libere)"]
    types: [completed]
  push:
    paths:
      - "storico/pagina.py"
      - "storico/pagina.html"
      - "storico/ritratti.py"
      - "storico/verifica_anni.py"
      - "storico/scaffali_lingua.py"
      - "storico/coautori.py"
      - "storico/applica_registro.py"
      - "storico/registro_opere.py"
      - "storico/nomi_it.py"
      - ".github/workflows/gia-pubblici.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gia-pubblici
  cancel-in-progress: false

jobs:
  pagina:
    # dopo lo Storico solo se lo Storico è finito bene (22/11/2026: prima partiva anche dopo un giro fallito o annullato)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ritratti da Wikimedia Commons
        continue-on-error: true   # senza ritratti la pagina mostra le iniziali
        run: python storico/ritratti.py
      - name: "Anni delle opere libere solo negli USA, conferma da Duke, Open Library, Library of Congress (docs/metodo-anni-opere.md)"
        continue-on-error: true
        run: python storico/verifica_anni.py 40
      - name: Scaffali per lingua (archivio intero, visite nella Wikipedia della lingua; storico/scaffali_lingua.py)
        continue-on-error: true   # se Wikidata non risponde resta il file di prima
        run: python storico/scaffali_lingua.py
      - name: Coautori (tipo degli autori senza data, membri dei gruppi, compositori e librettisti; storico/coautori.py)
        continue-on-error: true   # se Wikidata non risponde resta il file di prima
        run: python storico/coautori.py
      - name: Nomi italiani degli autori (storico/nomi_it.py)
        continue-on-error: true   # se Wikidata non risponde resta il file di prima
        run: python storico/nomi_it.py
      - name: "Autori «morti per la Francia» da Wikidata (storico/mpf.py)"
        continue-on-error: true   # se Wikidata non risponde resta il file di prima
        run: python storico/mpf.py
      - name: Anni di morte dal registro unico (storico/applica_registro.py)
        run: python storico/applica_registro.py
      - name: "Registro delle opere: coautori decisi con la regola unica (storico/registro_opere.py)"
        run: python storico/registro_opere.py
      - name: Dati e pagine
        run: python storico/pagina.py
      - name: Schede autore (lo stato USA opera per opera dipende dagli anni verificati)
        run: python scripts/pagine.py
      - name: Controllo delle regole per paese (Python e browser uguali) e delle frasi sui paesi
        run: |
          python scripts/prova_regole.py
          python scripts/controllo_frasi.py
      - name: Salva
        run: |
          # fotografia dello stato giuridico: se qualcuno che c'era già cambia stato senza un motivo atteso, non si pubblica
          # (scripts/confronta_fotografia.py); si salva solo l'elenco dei cambi da approvare, e il giro finisce rosso
          if ! python scripts/confronta_fotografia.py --giro; then
            git reset -q
            git add docs/cambi-da-approvare.md
            bash scripts/salva.sh "Cambi di stato da approvare $(date -u +%Y-%m-%d) (niente pubblicato)"
            exit 1
          fi
          git add -A data/storico data/registro/opere.json data/registro/mpf.json gia-pubblici en/already-public autore en/author assets/regole.js data/fotografia.json.gz docs/cambi-da-approvare.md
          bash scripts/salva.sh "Già pubblici: pagina e dati del $(date -u +%Y-%m-%d)"
