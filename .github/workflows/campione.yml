name: Campione di verifica SBN

on:
  push:
    paths:
      - "scripts/campione_sbn.py"
      - "scripts/campione_prove.py"
      - "scripts/campione_titoli.py"
      - "scripts/campione_valuta.py"
      - "scripts/riconosci_sbn.py"
      - ".github/workflows/campione.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  campione:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sceglie il campione, congela il risultato attuale e raccoglie le prove (non cambia il sito)
        env:
          BUDGET_MINUTI_SBN: "80"
        run: python scripts/campione_valuta.py fase3
      - name: Salva il campione
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/campione
          if ! git diff --cached --quiet; then
            git commit -m "Campione SBN: misura della fase 3"
            for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep $((i*20)); done
          fi
