name: Registro unico (anni di morte degli autori)

on:
  push:
    paths:
      - "docs/registro/passo.txt"
  schedule:
    - cron: "17 3 1 4,7,10,11 *"   # 1° aprile, luglio, ottobre (prima del rinfresco delle 5:17) e 1° novembre, controllo date (decisione di Marco, 22/11/2026)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registro
  cancel-in-progress: false

jobs:
  registro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Registro degli autori: anno di morte deciso con la regola delle due fonti (scripts/registro_autori.py)"
        run: python scripts/registro_autori.py
        env:
          BUDGET_MINUTI: "40"
      # 22/11/2026: quando il registro cambia un anno di morte, cambiano anche le liste e tutte le pagine che le leggono
      # (radar, pagine dell'anno, home, schede): si rifanno qui, con gli stessi controlli bloccanti degli altri giri
      - name: Liste con l'anno di morte del registro unico (scripts/applica_registro_liste.py)
        if: ${{ !cancelled() }}
        run: python scripts/applica_registro_liste.py
      - name: Pagine (schede, radar, pagine dell'anno, home)
        if: ${{ !cancelled() }}
        run: python scripts/pagine.py
      - name: Controlli (regole, schede e liste contro il registro)
        id: controlli
        if: ${{ !cancelled() }}
        run: |
          python scripts/prova_regole.py
          python scripts/controllo_frasi.py
      - name: Salva
        if: ${{ !cancelled() && steps.controlli.outcome == 'success' }}
        run: |
          if ! python scripts/confronta_fotografia.py --giro; then
            git reset -q
            git add docs/cambi-da-approvare.md
            bash scripts/salva.sh "Cambi di stato da approvare $(date -u +%Y-%m-%d) (niente pubblicato)"
            exit 1
          fi
          git add -A
          bash scripts/salva.sh "Registro degli autori del $(date -u +%Y-%m-%d), liste e pagine"
      - name: Se i controlli non passano si salva solo il registro (le pagine restano come prima)
        if: ${{ !cancelled() && steps.controlli.outcome != 'success' }}
        run: |
          cp -r data/registro /tmp/registro && cp data/cache_verifica.json /tmp/ 2>/dev/null || true
          git reset -q && git checkout -- . && git clean -fdq
          rm -rf data/registro && cp -r /tmp/registro data/registro && cp /tmp/cache_verifica.json data/ 2>/dev/null || true
          git add data/registro data/cache_verifica.json
          bash scripts/salva.sh "Registro degli autori del $(date -u +%Y-%m-%d) (liste e pagine non aggiornate: controlli falliti)"
          exit 1
