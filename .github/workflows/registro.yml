name: Registro unico (anni di morte degli autori)

on:
  push:
    paths:
      - "docs/registro/passo.txt"
  schedule:
    - cron: "17 3 1 * *"     # il 1° del mese, prima dello Storico (il 2): così lo Storico usa date fresche
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registro
  cancel-in-progress: false

jobs:
  registro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Registro degli autori: anno di morte deciso con la regola delle due fonti (scripts/registro_autori.py)"
        run: python scripts/registro_autori.py
        env:
          BUDGET_MINUTI: "40"
      - name: Salva
        if: ${{ !cancelled() }}
        run: |
          git add data/registro data/cache_verifica.json
          bash scripts/salva.sh "Registro degli autori del $(date -u +%Y-%m-%d)"
