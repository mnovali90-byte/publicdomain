name: Verifica Library of Congress su autori nuovi

# Il passo da fare si scrive in docs/verifica-loc/passo.txt: «prove» (raccoglie le prove senza il nuovo sistema)
# oppure «misura» (dopo gli esiti a mano). Parte a ogni modifica di quel file.
on:
  push:
    paths:
      - "docs/verifica-loc/passo.txt"

permissions:
  contents: write

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Passo indicato in passo.txt
        env:
          BUDGET_MINUTI_SBN: "100"
        run: python scripts/verifica_loc.py "$(tr -d '[:space:]' < docs/verifica-loc/passo.txt)"
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verifica-loc
          if ! git diff --cached --quiet; then
            git commit -m "Verifica LoC: passo $(cat docs/verifica-loc/passo.txt)"
            for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep $((i*20)); done
          fi
