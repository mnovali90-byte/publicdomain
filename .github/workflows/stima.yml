name: Stima accuratezza e copertura (non cambia il sito)

on:
  push:
    paths:
      - "docs/stima-sito/passo.txt"

permissions:
  contents: write

jobs:
  stima:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/$(tr -d "[:space:]" < docs/stima-sito/passo.txt).py
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch data/us-anni-verificati.json && git add assets/fonts assets/regole.js data/[0-9]*.json data/es-[0-9]*.json index.html en/index.html autore en/author data/us-anni-verificati.json data/us-[0-9]*.json data/indice.json pubblico-dominio-* en/public-domain-* docs/da-decidere.md docs/stima-sito docs/regola-lista docs/mockup-ritratti data/anniversari-*.json calendario en/calendar
          if ! git diff --cached --quiet; then
            git commit -m "Stima del sito: dati raccolti"
            # fino a 5 tentativi; se falliscono tutti il giro finisce ROSSO (22/11/2026: prima restava verde senza aver pubblicato)
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push; then ok=1; break; fi
              echo "Push fallito (tentativo $i)"; sleep $((i*20))
            done
            [ "$ok" = 1 ] || { echo "Push fallito 5 volte: niente pubblicato"; exit 1; }
          fi
