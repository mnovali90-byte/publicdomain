name: Stima accuratezza e copertura (non cambia il sito)

on:
  push:
    paths:
      - "docs/stima-sito/passo.txt"

permissions:
  contents: write

jobs:
  stima:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/$(tr -d "[:space:]" < docs/stima-sito/passo.txt).py
      - name: Salva
        if: ${{ !cancelled() }}   # 22/11/2026: prima «always()», salvava anche un giro annullato
        run: |
          # fotografia dello stato giuridico: se qualcuno che c'era già cambia stato senza un motivo atteso, non si pubblica
          # (scripts/confronta_fotografia.py); si salva solo l'elenco dei cambi da approvare, e il giro finisce rosso
          if ! python scripts/confronta_fotografia.py --giro; then
            git reset -q
            git add docs/cambi-da-approvare.md
            bash scripts/salva.sh "Cambi di stato da approvare $(date -u +%Y-%m-%d) (niente pubblicato)"
            exit 1
          fi
          touch data/us-anni-verificati.json && git add data/fotografia.json.gz docs/cambi-da-approvare.md assets/fonts assets/regole.js data/[0-9]*.json data/es-[0-9]*.json index.html en/index.html autore en/author data/us-anni-verificati.json data/us-[0-9]*.json data/indice.json pubblico-dominio-* en/public-domain-* pubblico-dominio en/public-domain come-funziona en/how-it-works shop en/shop docs/da-decidere.md docs/stima-sito docs/regola-lista docs/mockup-ritratti data/anniversari-*.json calendario en/calendar
          bash scripts/salva.sh "Stima del sito: dati raccolti"
