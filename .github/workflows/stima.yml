name: Stima accuratezza e copertura (non cambia il sito)

on:
  push:
    paths:
      - "docs/stima-sito/passo.txt"

permissions:
  contents: write

jobs:
  stima:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/$(tr -d "[:space:]" < docs/stima-sito/passo.txt).py
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stima-sito docs/regola-lista docs/mockup-ritratti data/anniversari-2027.json calendario en/calendar
          if ! git diff --cached --quiet; then
            git commit -m "Stima del sito: dati raccolti"
            for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep $((i*20)); done
          fi
