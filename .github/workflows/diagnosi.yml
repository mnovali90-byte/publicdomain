name: diagnosi
on:
  push:
    paths: [".github/workflows/diagnosi.yml"]
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prova fonti citate in Wikidata per la data di morte (non salva nulla)
        run: |
          cd scripts && python3 - <<'PY'
          import json, time, collections
          from verifica import sparql
          d=json.load(open("../data/2027.json"))
          una=[a for a in d["autori"] if a.get("letterario") and (a.get("verifica") or {}).get("esito")=="una_fonte"]
          fonti=collections.defaultdict(set); tipi=collections.Counter()
          for i in range(0,len(una),50):
              v=" ".join("wd:"+a["wikidata"] for a in una[i:i+50])
              q=f"""SELECT ?a ?anno ?fonteLabel ?imp WHERE {{ VALUES ?a {{ {v} }}
                ?a p:P570 ?s . ?s psv:P570/wikibase:timeValue ?t . BIND(YEAR(?t) AS ?anno)
                OPTIONAL {{ ?s prov:wasDerivedFrom ?r . OPTIONAL {{ ?r pr:P248 ?fonte }} OPTIONAL {{ ?r pr:P143 ?imp }} OPTIONAL {{ ?r pr:P854 ?url }} }}
                SERVICE wikibase:label {{ bd:serviceParam wikibase:language "en". }} }}"""
              for b in sparql(q):
                  qid=b["a"]["value"].rsplit("/",1)[-1]
                  if "fonteLabel" in b: fonti[qid].add(("citata",b["fonteLabel"]["value"],b["anno"]["value"]))
                  elif "imp" in b: fonti[qid].add(("wikipedia","",b["anno"]["value"]))
              time.sleep(2)
          n_cit=n_wp=n_nulla=0
          for a in una:
              f=fonti.get(a["wikidata"],set())
              cit=[x for x in f if x[0]=="citata"]
              if cit: n_cit+=1; [tipi.update([x[1]]) for x in cit]
              elif f: n_wp+=1
              else: n_nulla+=1
              print("A|",a["nome"],"|",a["morte"][:4],"|",sorted(f)[:4])
          print("TOT| una_fonte",len(una),"| con fonte citata",n_cit,"| solo 'importato da Wikipedia'",n_wp,"| nessuna fonte",n_nulla)
          print("FONTI|",tipi.most_common(25))
          PY
