name: diagnosi
on:
  push:
    paths: [".github/workflows/diagnosi.yml"]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,json
          UA={"User-Agent":"PublicDomainRadar-diagnosi/1.0 (publicdomainradar.com)"}
          def get(u,acc=None):
            h=dict(UA); 
            if acc: h["Accept"]=acc
            return urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=90).read().decode("utf-8","replace")
          def n(t): m=re.search(r"numberOfRecords>(\d+)",t); return m.group(1) if m else ("DIAG:"+(re.search(r"<(?:diag:)?message>([^<]*)",t) or re.search(r"(.{0,200})",t)).group(1))
          G="https://d-nb.info/gnd/118514768"
          def dnb(q):
            for ep in ["https://sparql.dnb.de/api/dnbgnd"]:
              try:
                t=get(ep+"?"+urllib.parse.urlencode({"query":q}),"application/sparql-results+json"); return t[:600]
              except Exception as e: return f"ERR {e}"
          print("DNB ger2000", dnb(f"SELECT (COUNT(DISTINCT ?r) AS ?n) WHERE {{ ?r <http://purl.org/dc/terms/creator> <{G}> ; <http://purl.org/dc/terms/language> <http://id.loc.gov/vocabulary/iso639-2/ger> ; <http://purl.org/dc/terms/issued> ?d . FILTER(xsd:integer(SUBSTR(STR(?d),1,4)) >= 2000) }}"))
          print("DNB senza_lingua", dnb(f"SELECT (COUNT(DISTINCT ?r) AS ?n) WHERE {{ ?r <http://purl.org/dc/terms/creator> <{G}> . FILTER NOT EXISTS {{ ?r <http://purl.org/dc/terms/language> ?l }} }}"))
          def sru(nome,base,q,ver="1.2"):
            try:
              t=get(base+"?"+urllib.parse.urlencode({"version":ver,"operation":"searchRetrieve","query":q,"maximumRecords":"0"}))
              print(nome,q,"->",n(t))
            except Exception as e: print(nome,q,"ERR",e)
          BNE="https://catalogo.bne.es/view/sru/34BNE_INST"; BL="https://eu06.alma.exlibrisgroup.com/view/sru/44BL_MAIN"
          sru("BNE",BNE,'alma.authority_id=XX1150786 and alma.language=spa')
          sru("BNE",BNE,'alma.authority_id=XX1150786 and alma.language=spa and alma.main_pub_date>=2000')
          sru("BL",BL,'alma.isni_identifier=0000000121268426')
          sru("BL",BL,'alma.isni_identifier="0000 0001 2126 8426"')
          sru("BL",BL,'alma.authority_id=n79006035')
          sru("BL",BL,'alma.authority_id="(uk)n79006035"')
          sru("BL",BL,'alma.creator="Brecht, Bertolt, 1898-1956"')
          PY
