name: diagnosi
on:
  push:
    paths: [".github/workflows/diagnosi.yml"]
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rigenera il calendario 2027 con la ricerca nuova (solo prova, non salva nulla)
        env:
          ANNO_CALENDARIO: "2027"
          RIGENERA_APPROVATO: "1"
          BUDGET_MINUTI_ANNIV: "70"
        run: |
          cp data/anniversari-2027.json /tmp/approvato.json
          python scripts/anniversari.py || true
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/approvato.json")); n=json.load(open("data/anniversari-2027.json"))
          qa={(v["tipo"],v["qid"]) for v in a["voci"]}
          nuove=[v for v in n["voci"] if (v["tipo"],v["qid"]) not in qa]
          nuove.sort(key=lambda v:-v["pagine"])
          print("APPROVATO",len(a["voci"]),"NUOVO",len(n["voci"]),"IN PIU",len(nuove))
          for v in nuove[:80]:
              print("NUOVA|",v["tipo"],"|",v["nome"],"|",v.get("autore"),"|",v["anni"],"|",v["pagine"],"|",(v.get("desc") or "")[:80])
          qn={(v["tipo"],v["qid"]) for v in n["voci"]}
          for v in sorted([v for v in a["voci"] if (v["tipo"],v["qid"]) not in qn],key=lambda v:-v["pagine"])[:30]:
              print("PERSA|",v["tipo"],"|",v["nome"],"|",v["pagine"])
          PY
