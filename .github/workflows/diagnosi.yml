name: diagnosi
on:
  push:
    paths: [".github/workflows/diagnosi.yml"]
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rigenera il 2027 e stampa la voce di The Price of Salt (non salva nulla)
        env:
          ANNO_CALENDARIO: "2027"
          RIGENERA_APPROVATO: "1"
          BUDGET_MINUTI_ANNIV: "70"
        run: |
          python scripts/anniversari.py || true
          python3 -c "
          import json
          n=json.load(open('data/anniversari-2027.json'))
          for v in n['voci']:
              if 'Highsmith' in (v.get('autore') or ''): print('VOCE|'+json.dumps(v,ensure_ascii=False))
          "
