name: diagnosi
on:
  push:
    paths: [".github/workflows/diagnosi.yml"]
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,re
          UA={"User-Agent":"PublicDomainRadar-diagnosi/1.0 (publicdomainradar.com)"}
          def get(u):
            return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90).read().decode("utf-8","replace")
          q='SELECT ?bnf ?gnd ?sbn ?bne WHERE { OPTIONAL{wd:Q38757 wdt:P268 ?bnf} OPTIONAL{wd:Q38757 wdt:P227 ?gnd} OPTIONAL{wd:Q38757 wdt:P396 ?sbn} OPTIONAL{wd:Q38757 wdt:P950 ?bne} }'
          r=json.loads(get("https://query.wikidata.org/sparql?"+urllib.parse.urlencode({"query":q,"format":"json"})))["results"]["bindings"]
          ids={k:v["value"] for k,v in r[0].items()}; print("IDS",ids)
          rid=re.sub(r"\D","",ids.get("bnf",""))[:8]
          anni=" ".join(str(y) for y in range(2000,2027))
          prove={
           "tutti":f'bib.author2bib all "{rid}"',
           "fre":f'bib.author2bib all "{rid}" and bib.language any "fre"',
           "fre2000":f'bib.author2bib all "{rid}" and bib.language any "fre" and bib.date any "{anni}"',
           "aut_nome_fre":'bib.author all "Brecht Bertolt" and bib.language any "fre"',
          }
          for k,qq in prove.items():
            u="https://catalogue.bnf.fr/api/SRU?"+urllib.parse.urlencode({"version":"1.2","operation":"searchRetrieve","query":qq,"maximumRecords":"0"})
            try:
              t=get(u); m=re.search(r"<srw:numberOfRecords>(\d+)",t); d=re.search(r"<diag:message>([^<]*)",t)
              print("BNF",k,m.group(1) if m else None,d.group(1) if d else "")
            except Exception as e: print("BNF",k,"ERR",e)
          # DNB per GND
          for k,qq in {"dnb_tutti":f'nid={ids.get("gnd","")}', "dnb_ger":f'nid={ids.get("gnd","")} and spr=ger'}.items():
            u="https://services.dnb.de/sru/dnb?"+urllib.parse.urlencode({"version":"1.1","operation":"searchRetrieve","query":qq,"maximumRecords":"0","recordSchema":"MARC21-xml"})
            try:
              t=get(u); m=re.search(r"numberOfRecords>(\d+)",t); print("DNB",k,m.group(1) if m else t[:200])
            except Exception as e: print("DNB",k,"ERR",e)
          PY
