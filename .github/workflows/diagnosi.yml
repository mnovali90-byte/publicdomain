name: diagnosi
on:
  push:
    paths: [".github/workflows/diagnosi.yml"]
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prova storico per autore, a blocchi (non salva nulla)
        run: |
          cd scripts && python3 - <<'PY'
          import json, glob, time
          from opere import sparql, val, qid
          gia=set(); autori={}
          for f in glob.glob("../data/storico/ricerca/*.json"):
              d=json.load(open(f))
              for o in d["opere"]: gia.add(o[0])
              for a in d["autori"]: autori[a[0]]=a
          lista=sorted(autori.values(), key=lambda a:-a[3])
          print("AUTORI|",len(lista))
          ESC="wd:Q13442814,wd:Q732577,wd:Q1980247,wd:Q187685,wd:Q1266946,wd:Q3331189,wd:Q5,wd:Q4167410"
          tot={}; t0=time.time(); err=0
          for i in range(0, min(len(lista),3000), 150):
              v=" ".join("wd:"+a[0] for a in lista[i:i+150])
              q=f"""SELECT ?w ?wLabel ?sl (MIN(YEAR(?p)) AS ?pub) (MIN(YEAR(?c)) AS ?cre) (SAMPLE(?a) AS ?aut) WHERE {{
                VALUES ?a {{ {v} }} ?w wdt:P50 ?a. ?w wikibase:sitelinks ?sl. FILTER(?sl>=1)
                FILTER NOT EXISTS {{ ?w wdt:P31 ?x. VALUES ?x {{ {ESC.replace(',',' ')} }} }}
                OPTIONAL {{ ?w wdt:P577 ?p }} OPTIONAL {{ ?w wdt:P571 ?c }}
                SERVICE wikibase:label {{ bd:serviceParam wikibase:language "it,en". }} }} GROUP BY ?w ?wLabel ?sl"""
              t=time.time()
              try: r=sparql(q)
              except Exception as e: err+=1; print("ERR|",i,e); continue
              for x in r: tot[qid(val(x,"w"))]=x
              print(f"BLOCCO| {i} {time.time()-t:.0f}s righe {len(r)}", flush=True)
              time.sleep(1)
          nuove=[x for k,x in tot.items() if k not in gia]
          senza=[x for x in nuove if not val(x,"pub") and not val(x,"cre")]
          print(f"TOT| tempo {time.time()-t0:.0f}s | errori {err} | opere {len(tot)} | nuove {len(nuove)} | nuove senza data {len(senza)}")
          print("NUOVE|",[(val(x,"wLabel"),val(x,"pub") or val(x,"cre")) for x in sorted(nuove,key=lambda x:-int(val(x,"sl")))[:60]])
          for t in ["Q41567","Q8275","Q35160","Q16867","Q1004","Q191380","Q16867","Q482"]:
              print("CASO|",t,t in tot, t in gia)
          PY
