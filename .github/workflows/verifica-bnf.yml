name: Verifica BnF su autori nuovi

# Il passo da fare si scrive in docs/verifica-bnf/passo.txt: «prove» (raccoglie le prove senza il nuovo sistema)
# oppure «misura» (dopo gli esiti a mano). Parte a ogni modifica di quel file.
on:
  push:
    paths:
      - "docs/verifica-bnf/passo.txt"

permissions:
  contents: write

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Passo indicato in passo.txt
        env:
          BUDGET_MINUTI_SBN: "100"
        run: python scripts/verifica_bnf.py "$(tr -d '[:space:]' < docs/verifica-bnf/passo.txt)"
      - name: Salva
        if: always()
        run: |
          git add docs/verifica-bnf
          bash scripts/salva.sh "Verifica BnF: passo $(cat docs/verifica-bnf/passo.txt)"
