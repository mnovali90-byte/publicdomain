name: Fonti di prima uscita per le opere USA (Wikidata e bibliografie nazionali; non cambia il sito)

# Parte solo cambiando docs/registro/passo-fonti.txt, con l'ok di Marco (23/11/2026).
# Scrive solo data/fonti_prima_uscita.json e i rapporti (collaudo e incrocio 2028), che non entrano nel sito.
on:
  push:
    paths:
      - "docs/registro/passo-fonti.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fonti-prima-uscita
  cancel-in-progress: false

jobs:
  fonti:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wikidata (data, rivista, edizioni) e bibliografia nella lingua originale (K10plus, BnF, BNE, SBN)
        env:
          BUDGET_MINUTI: "40"
          LISTE: "2027,2028"
        run: python scripts/fonti_prima_uscita.py
      - name: Rifà il collaudo sulle 55 e il giro 2028 con i dati nuovi
        if: ${{ !cancelled() }}
        run: |
          python scripts/collaudo_incrocio.py
          LISTA=2028 python scripts/incrocio_opere.py
      - name: Salva solo dati e rapporti
        if: ${{ !cancelled() }}
        run: |
          git add data/fonti_prima_uscita.json docs/collaudo-incrocio.md docs/incrocio-us-2028.md 2>/dev/null || true
          bash scripts/salva.sh "Fonti di prima uscita: dati e collaudo"
