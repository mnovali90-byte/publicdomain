name: Prova SBN (temporanea)
on:
  push:
    paths:
      - "scripts/prova_sbn.py"
      - ".github/workflows/prova-sbn.yml"
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/prova_sbn.py
