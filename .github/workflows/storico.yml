name: Aggiorna lo Storico (opere già libere)

on:
  schedule:
    - cron: "23 4 * * 1"   # ogni lunedì mattina
  workflow_dispatch:        # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

concurrency:
  group: storico
  cancel-in-progress: false

jobs:
  storico:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Opere libere negli USA, con le visite della settimana
        env:
          BUDGET_MINUTI_STORICO: "80"
        run: python storico/storico.py
      - name: Salva i dati nel repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/storico
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Storico: dati del $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash -X theirs origin main
              if git push; then break; fi
              [ "$i" = 5 ] && exit 1
              sleep $((i*20))
            done
          fi
