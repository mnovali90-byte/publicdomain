name: Prova Thema 2 – fonti in più per 106 opere (non cambia il sito)

# Parte solo cambiando docs/registro/passo-thema2.txt, con l'ok di Marco (26/11/2026).
# Scrive solo docs/stima-sito/prova-thema/ (descrizioni, lista Thema, rapporto): niente pagine, niente registro.
on:
  push:
    paths:
      - "docs/registro/passo-thema2.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prova-thema2
  cancel-in-progress: false

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Edizioni, Gutenberg, Open Library, GND, Wikisource
        run: python scripts/prova_thema2.py
      - name: Salva solo la cartella della prova
        if: ${{ !cancelled() }}
        run: |
          git add docs/stima-sito/prova-thema/ 2>/dev/null || true
          bash scripts/salva.sh "Prova Thema 2: fonti in più raccolte"
